name: Site quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check script.js && node --check fare-engine.js
      - name: Run fare-engine tests
        run: node --test tests/fare-engine.test.cjs
      - name: Run static HTML and link checks
        run: python3 tests/check_site.py && python3 tests/check_seo_implementation.py
